<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sub2 Desk - Sub2API Desktop Console</title>
  <style>html{background:#f5f5f7}html.dark{background:#222226}body{background:transparent!important}</style>
  <script>
    // Restore appearance before CSS/modules arrive; never overwrite preferences here.
    try {
      var prefs = JSON.parse(localStorage.getItem('sub2-desktop-preferences') || '{}') || {};
      var mode = ['light','dark','system'].includes(prefs.appearance) ? prefs.appearance : prefs.isDark === true ? 'dark' : 'light';
      var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    } catch (_) { /* Use the light fallback when storage is unavailable. */ }
  </script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=sub2desk-1" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=sub2desk-1" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="overflow-hidden select-none">
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
