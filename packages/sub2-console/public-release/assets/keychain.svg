<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Multi-stop Amber Leather Gradient -->
    <linearGradient id="kcBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb300"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Metallic Key Gradient -->
    <linearGradient id="silverKey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="goldKey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="80%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <filter id="kcDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.32"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>

    <filter id="keyCastShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#78350f" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="6" y="6" width="88" height="88" rx="20" fill="url(#kcBg)" filter="url(#kcDropShadow)"/>
  
  <!-- Subtle Inner Top Highlight -->
  <rect x="6.5" y="6.5" width="87" height="87" rx="19.5" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>

  <!-- Concentric Medallion Rings -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="26" fill="rgba(0,0,0,0.06)"/>

  <!-- Diagonal Golden Yale Key -->
  <g transform="rotate(-35 50 50)" filter="url(#keyCastShadow)">
    <!-- Key Bow (Head) -->
    <circle cx="34" cy="50" r="14" fill="url(#goldKey)"/>
    <circle cx="34" cy="50" r="6" fill="#b45309"/>
    <!-- Key Shaft -->
    <rect x="42" y="47" width="34" height="6" rx="2" fill="url(#goldKey)"/>
    <!-- Key Bits / Teeth -->
    <rect x="64" y="53" width="5" height="7" rx="1.5" fill="url(#goldKey)"/>
    <rect x="71" y="53" width="5" height="5" rx="1.5" fill="url(#goldKey)"/>
  </g>

  <!-- Cross Yale Silver Key in Background -->
  <g transform="rotate(28 48 48)" opacity="0.88">
    <circle cx="35" cy="48" r="12" fill="url(#silverKey)"/>
    <circle cx="35" cy="48" r="5" fill="#475569"/>
    <rect x="42" y="45.5" width="30" height="5" rx="1.5" fill="url(#silverKey)"/>
    <rect x="62" y="50.5" width="4" height="6" rx="1" fill="url(#silverKey)"/>
  </g>
</svg>
