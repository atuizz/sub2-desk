<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
<linearGradient id="comChassis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="comRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
    <clipPath id="squircleClip">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <filter id="macAppDropShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="20" stdDeviation="16" flood-color="#065f46" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Apple macOS Tahoe Native Continuous Squircle Base (824x824 with rx=185 on 1024 grid) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#comChassis)" filter="url(#macAppDropShadow)"/>

  <!-- Apple Knife-Edge Bezel Highlight -->
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="url(#comRim)" stroke-width="2"/>

  <!-- Precision Scaled Vector Artwork Clipped to Apple Squircle -->
  <g clip-path="url(#squircleClip)">
    <g transform="translate(100, 100) scale(8.24) translate(-14, -14)">
      <g filter="drop-shadow(0 4px 8px rgba(0,0,0,0.3))">
    <path d="M 38 34 C 38 32, 40 30, 42 30 L 86 30 C 88 30, 90 32, 90 34 L 90 94 L 82 88 L 74 94 L 64 88 L 54 94 L 46 88 L 38 94 Z" fill="#ffffff"/>
    <rect x="46" y="42" width="36" height="4" rx="2" fill="#10b981"/>
    <rect x="46" y="52" width="24" height="3" rx="1.5" fill="#94a3b8"/>
    <rect x="46" y="60" width="36" height="3" rx="1.5" fill="#cbd5e1"/>
    <circle cx="64" cy="74" r="8" fill="#10b981"/>
    <text x="64" y="79" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">$</text>
    </g>
  </g>
  </g>
</svg>
