<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
<linearGradient id="netChassis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="netRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
    <clipPath id="squircleClip">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <filter id="macAppDropShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="20" stdDeviation="16" flood-color="#0369a1" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Apple macOS Tahoe Native Continuous Squircle Base (824x824 with rx=185 on 1024 grid) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#netChassis)" filter="url(#macAppDropShadow)"/>

  <!-- Apple Knife-Edge Bezel Highlight -->
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="url(#netRim)" stroke-width="2"/>

  <!-- Precision Scaled Vector Artwork Clipped to Apple Squircle -->
  <g clip-path="url(#squircleClip)">
    <g transform="translate(100, 100) scale(8.24) translate(-14, -14)">
      <g filter="drop-shadow(0 3px 6px rgba(0,0,0,0.3))">
    <path d="M 32 46 A 46 46 0 0 1 96 46" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <path d="M 42 60 A 32 32 0 0 1 86 60" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <path d="M 53 74 A 16 16 0 0 1 75 74" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <circle cx="64" cy="90" r="6" fill="#ffffff"/>
    </g>
  </g>
  </g>
</svg>
