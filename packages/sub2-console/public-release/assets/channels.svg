<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
<linearGradient id="chnChassis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <linearGradient id="chnRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
    
    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="squircleClip">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <filter id="macAppDropShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="20" stdDeviation="16" flood-color="#581c87" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Apple macOS Tahoe Native Continuous Squircle Base (824x824 with rx=185 on 1024 grid) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#chnChassis)" filter="url(#macAppDropShadow)"/>

  <!-- Apple Knife-Edge Bezel Highlight -->
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="url(#chnRim)" stroke-width="2"/>

  <!-- Precision Scaled Vector Artwork Clipped to Apple Squircle -->
  <g clip-path="url(#squircleClip)">
    <g transform="translate(100, 100) scale(8.24) translate(-14, -14)">
      <path d="M 38 48 A 38 38 0 0 1 90 48" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 46 58 A 26 26 0 0 1 82 58" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 54 68 A 14 14 0 0 1 74 68" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" filter="url(#nodeGlow)"/>
  <line x1="64" y1="72" x2="64" y2="96" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="64" cy="70" r="6" fill="#ffffff" filter="url(#nodeGlow)"/>
  <polygon points="50,96 78,96 64,84" fill="rgba(255,255,255,0.45)"/>
    </g>
  </g>
</svg>