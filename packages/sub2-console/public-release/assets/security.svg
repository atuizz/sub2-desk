<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="secChassis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="45%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="secRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="shieldSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="shieldInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <clipPath id="squircleClip">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <filter id="macAppDropShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="20" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
    <filter id="shieldEmboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="rgba(0,0,0,0.35)"/>
    </filter>
  </defs>

  <!-- Apple macOS Tahoe Native Continuous Squircle Base (824x824 with rx=185 on 1024 grid) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#secChassis)" filter="url(#macAppDropShadow)"/>

  <!-- Apple Knife-Edge Bezel Highlight -->
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="url(#secRim)" stroke-width="2"/>

  <!-- Precision Scaled Vector Artwork Clipped to Apple Squircle -->
  <g clip-path="url(#squircleClip)">
    <!-- Subtle background radial glow -->
    <circle cx="512" cy="480" r="300" fill="#60a5fa" opacity="0.18" filter="blur(40px)"/>
    
    <!-- Outer Metallic Shield -->
    <g filter="url(#shieldEmboss)">
      <path d="M 512 240 C 650 240, 720 280, 720 400 C 720 580, 610 700, 512 770 C 414 700, 304 580, 304 400 C 304 280, 374 240, 512 240 Z" fill="url(#shieldSilver)"/>
      <path d="M 512 265 C 632 265, 694 300, 694 405 C 694 562, 598 668, 512 730 C 426 668, 330 562, 330 405 C 330 300, 392 265, 512 265 Z" fill="url(#shieldInner)"/>
      
      <!-- Keyhole / Checkmark / Padlock Emblem -->
      <path d="M 482 450 C 482 433, 495 420, 512 420 C 529 420, 542 433, 542 450 C 542 461, 536 470, 526 475 L 532 545 C 533 550, 528 555, 523 555 L 501 555 C 496 555, 491 550, 492 545 L 498 475 C 488 470, 482 461, 482 450 Z" fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.3))"/>
      
      <!-- Shimmer Highlight line on left facet of shield -->
      <path d="M 512 265 L 512 730" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
    </g>
  </g>
</svg>