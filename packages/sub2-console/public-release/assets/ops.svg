<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
<linearGradient id="opsChassis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="opsInnerPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="opsRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </linearGradient>
    
    <filter id="pulseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="squircleClip">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <filter id="macAppDropShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="20" stdDeviation="16" flood-color="#09090b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Apple macOS Tahoe Native Continuous Squircle Base (824x824 with rx=185 on 1024 grid) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#opsChassis)" filter="url(#macAppDropShadow)"/>

  <!-- Apple Knife-Edge Bezel Highlight -->
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="url(#opsRim)" stroke-width="2"/>

  <!-- Precision Scaled Vector Artwork Clipped to Apple Squircle -->
  <g clip-path="url(#squircleClip)">
    <g transform="translate(100, 100) scale(8.24) translate(-14, -14)">
      <path d="M 23,64 C 23,32 32,23 64,23 C 96,23 105,32 105,64 C 105,96 96,105 64,105 C 32,105 23,96 23,64 Z" fill="url(#opsInnerPlate)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="24" y1="64" x2="104" y2="64" stroke="rgba(34,197,94,0.15)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="64" y1="24" x2="64" y2="104" stroke="rgba(34,197,94,0.15)" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="64" cy="64" r="32" fill="none" stroke="rgba(34,197,94,0.18)" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="18" fill="none" stroke="rgba(34,197,94,0.25)" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="5" fill="none" stroke="rgba(34,197,94,0.4)" stroke-width="1.5"/>
  <polyline points="26,64 42,64 48,46 56,84 64,36 72,78 78,54 84,64 102,64" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#pulseGlow)"/>
  <circle cx="88" cy="38" r="3.5" fill="#22c55e" filter="drop-shadow(0 0 6px #22c55e)"/>
    </g>
  </g>
</svg>