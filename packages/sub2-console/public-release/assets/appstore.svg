<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="asBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1488cc"/>
      <stop offset="50%" stop-color="#2b32b2"/>
      <stop offset="100%" stop-color="#1a1c6a"/>
    </linearGradient>

    <linearGradient id="rodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <filter id="asDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.32"/>
    </filter>

    <filter id="rodShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0a1236" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Deep Cobalt Squircle -->
  <rect x="6" y="6" width="88" height="88" rx="20" fill="url(#asBase)" filter="url(#asDropShadow)"/>
  <rect x="6.5" y="6.5" width="87" height="87" rx="19.5" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1"/>

  <!-- Iconic 'A' Cross Rods -->
  <!-- Left Leg (Pencil) -->
  <g filter="url(#rodShadow)">
    <rect x="46" y="16" width="8" height="68" rx="4" transform="rotate(-28 50 50)" fill="url(#rodGrad)"/>
  </g>

  <!-- Right Leg (Brush) -->
  <g filter="url(#rodShadow)">
    <rect x="46" y="16" width="8" height="68" rx="4" transform="rotate(28 50 50)" fill="url(#rodGrad)"/>
  </g>

  <!-- Horizontal Bar (Ruler) -->
  <g filter="url(#rodShadow)">
    <rect x="22" y="55" width="56" height="8" rx="4" fill="url(#rodGrad)"/>
    <!-- Ruler hash marks -->
    <line x1="32" y1="56" x2="32" y2="59" stroke="#64748b" stroke-width="1"/>
    <line x1="42" y1="56" x2="42" y2="60" stroke="#64748b" stroke-width="1"/>
    <line x1="58" y1="56" x2="58" y2="60" stroke="#64748b" stroke-width="1"/>
    <line x1="68" y1="56" x2="68" y2="59" stroke="#64748b" stroke-width="1"/>
  </g>
</svg>
