<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="oBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00a4ef"/>
      <stop offset="100%" stop-color="#0078d4"/>
    </linearGradient>
    <linearGradient id="oFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#005a9e"/>
      <stop offset="100%" stop-color="#004578"/>
    </linearGradient>
    <filter id="oShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Envelope Folds -->
  <rect x="24" y="20" width="64" height="60" rx="14" fill="url(#oBack)"/>
  <!-- Envelope Flap Geometry -->
  <path d="M26 26 L56 48 L86 26" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.6" stroke-linejoin="round"/>
  <polygon points="26,78 56,48 86,78" fill="#ffffff" opacity="0.15"/>

  <!-- Front O Badge Tile -->
  <rect x="12" y="26" width="46" height="48" rx="10" fill="url(#oFront)" filter="url(#oShadow)"/>
  <text x="35" y="61" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">O</text>
</svg>