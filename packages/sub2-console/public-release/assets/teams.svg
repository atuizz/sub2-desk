  <!-- Front T Badge Tile -->
  <rect x="12" y="28" width="46" height="48" rx="10" fill="url(#tFront)" filter="url(#tShadow)"/>
  <text x="35" y="62" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">T</text>
</svg>