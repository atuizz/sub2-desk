  </defs>
  <!-- Background Person 1 -->
  <circle cx="70" cy="30" r="10" fill="#7b83eb"/>
  <path d="M56 64 C56 50 62 46 72 46 C82 46 88 50 88 64 Z" fill="#7b83eb"/>

