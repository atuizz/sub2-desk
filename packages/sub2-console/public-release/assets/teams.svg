<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="tBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7b83eb"/>
      <stop offset="100%" stop-color="#5059c9"/>
    </linearGradient>
    <linearGradient id="tFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#464eb8"/>
      <stop offset="100%" stop-color="#333a9b"/>
    </linearGradient>
    <filter id="tShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-opacity="0.3"/>
