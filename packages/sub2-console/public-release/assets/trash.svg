<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="tMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e8ed" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#b0b0b8" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="tGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#d0d0d8" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  
  <!-- Crumpled Colorful Papers inside Rim -->
  <polygon points="32,26 42,15 48,25 38,30" fill="#ff3b30"/>
  <polygon points="46,24 54,12 64,22 56,28" fill="#007aff"/>
  <polygon points="60,26 70,16 76,26 66,32" fill="#ffcc00"/>
  <polygon points="38,28 50,18 60,26 48,34" fill="#34c759"/>
  <polygon points="44,22 58,16 68,24 52,32" fill="#af52de"/>
  <polygon points="28,30 38,22 48,32 36,36" fill="#ffffff"/>

  <!-- Top Rim Oval -->
  <ellipse cx="50" cy="28" rx="34" ry="9" fill="#f4f4f6" stroke="#c0c0c6" stroke-width="2"/>

  <!-- Translucent Trash Can Body -->
  <path d="M16 28 L24 84 C24 89 34 92 50 92 C66 92 76 89 76 84 L84 28 Z" fill="url(#tGlass)" stroke="url(#tMetal)" stroke-width="1.8"/>

  <!-- Vertical Ribs -->
  <line x1="26" y1="36" x2="31" y2="84" stroke="#a0a0aa" stroke-width="1.2" opacity="0.6"/>
  <line x1="38" y1="37" x2="41" y2="87" stroke="#a0a0aa" stroke-width="1.2" opacity="0.7"/>
  <line x1="50" y1="37" x2="50" y2="88" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
  <line x1="62" y1="37" x2="59" y2="87" stroke="#a0a0aa" stroke-width="1.2" opacity="0.7"/>
  <line x1="74" y1="36" x2="69" y2="84" stroke="#a0a0aa" stroke-width="1.2" opacity="0.6"/>

  <!-- Specular Highlights -->
  <path d="M18 32 L25 82" stroke="#ffffff" stroke-width="2" opacity="0.75" stroke-linecap="round"/>
</svg>