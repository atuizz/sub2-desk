<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
<linearGradient id="dashChassis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="dashInnerPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="meterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="dashRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
    
    <filter id="needleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="squircleClip">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <filter id="macAppDropShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="20" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Apple macOS Tahoe Native Continuous Squircle Base (824x824 with rx=185 on 1024 grid) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#dashChassis)" filter="url(#macAppDropShadow)"/>

  <!-- Apple Knife-Edge Bezel Highlight -->
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="url(#dashRim)" stroke-width="2"/>

  <!-- Precision Scaled Vector Artwork Clipped to Apple Squircle -->
  <g clip-path="url(#squircleClip)">
    <g transform="translate(100, 100) scale(8.24) translate(-14, -14)">
      <path d="M 23,64 C 23,32 32,23 64,23 C 96,23 105,32 105,64 C 105,96 96,105 64,105 C 32,105 23,96 23,64 Z" fill="url(#dashInnerPlate)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <path d="M 38 78 A 33 33 0 1 1 90 78" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="6" stroke-linecap="round"/>
  <path d="M 38 78 A 33 33 0 1 1 84 45" fill="none" stroke="url(#meterGrad)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="38" cy="78" r="2" fill="#38bdf8"/>
  <circle cx="41" cy="54" r="2" fill="rgba(255,255,255,0.6)"/>
  <circle cx="64" cy="42" r="2.5" fill="#ffffff"/>
  <circle cx="87" cy="54" r="2" fill="rgba(255,255,255,0.6)"/>
  <circle cx="90" cy="78" r="2" fill="#f43f5e"/>
  <circle cx="64" cy="74" r="7" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="64" cy="74" r="2.5" fill="#ffffff"/>
  <line x1="64" y1="74" x2="81" y2="49" stroke="#ffffff" stroke-width="3" stroke-linecap="round" filter="url(#needleGlow)"/>
  <rect x="36" y="88" width="14" height="4" rx="2" fill="#38bdf8" opacity="0.9"/>
  <rect x="54" y="86" width="14" height="6" rx="2" fill="#3b82f6" opacity="0.9"/>
  <rect x="72" y="84" width="14" height="8" rx="2" fill="#818cf8" opacity="0.9"/>
    </g>
  </g>
</svg>