<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="actChassis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3d45"/>
      <stop offset="50%" stop-color="#25272e"/>
      <stop offset="100%" stop-color="#16171b"/>
    </linearGradient>

    <radialGradient id="screenGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1811"/>
      <stop offset="100%" stop-color="#020604"/>
    </radialGradient>

    <filter id="neonPulse" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="actShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Chassis Squircle -->
  <rect x="6" y="6" width="88" height="88" rx="20" fill="url(#actChassis)" filter="url(#actShadow)"/>
  <rect x="6.5" y="6.5" width="87" height="87" rx="19.5" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>

  <!-- Sunken Screen -->
  <rect x="15" y="15" width="70" height="70" rx="14" fill="url(#screenGrad)" stroke="#1a201c" stroke-width="1.5"/>

  <!-- CRT Fine Grid -->
  <path d="M15 32.5 H85 M15 50 H85 M15 67.5 H85 M32.5 15 V85 M50 15 V85 M67.5 15 V85" stroke="#12301f" stroke-width="0.8" opacity="0.85"/>

  <!-- Glowing Phosphor Sine Wave -->
  <path d="M16 50 L30 50 L38 28 L46 72 L54 38 L60 56 L66 50 L84 50" fill="none" stroke="#30d158" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonPulse)"/>

  <!-- Peak Indicator Blips -->
  <circle cx="38" cy="28" r="2" fill="#ffffff"/>
  <circle cx="46" cy="72" r="2" fill="#ffffff"/>
</svg>
