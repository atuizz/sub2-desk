<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="termShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Metallic Chassis -->
  <rect x="14" y="14" width="100" height="100" rx="22" fill="url(#termBg)" filter="url(#termShadow)"/>
  <rect x="14.5" y="14.5" width="99" height="99" rx="21.5" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>

  <!-- Sunken Terminal Window Frame -->
  <rect x="22" y="24" width="84" height="80" rx="10" fill="#090d16" stroke="#334155" stroke-width="1.2"/>

  <!-- Titlebar Header -->
  <path d="M 22 34 C 22 28.5, 26.5 24, 32 24 L 96 24 C 101.5 24, 106 28.5, 106 34 L 106 42 L 22 42 Z" fill="#1e293b"/>
  <!-- Traffic Lights -->
  <circle cx="32" cy="33" r="3.2" fill="#ff5f56"/>
  <circle cx="41" cy="33" r="3.2" fill="#ffbd2e"/>
  <circle cx="50" cy="33" r="3.2" fill="#27c93f"/>

  <!-- Prompt Command '>_' -->
  <path d="M 34 58 L 48 68 L 34 78" fill="none" stroke="#f8fafc" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="56" y1="78" x2="74" y2="78" stroke="#34c759" stroke-width="4" stroke-linecap="round"/>
</svg>
