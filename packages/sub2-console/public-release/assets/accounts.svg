<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- macOS Tahoe Deep Royal Indigo to Twilight Purple Chassis -->
    <linearGradient id="accChassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="35%" stop-color="#312e81"/>
      <stop offset="70%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Apple Knife-Edge Bezel Highlight -->
    <linearGradient id="accRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="80%" stop-color="#000000" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Account Identity Badge Card Gradient -->
    <linearGradient id="accBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>

    <!-- Metallic Gold Smart Chip -->
    <linearGradient id="chipGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Volumetric Shadow -->
    <filter id="macAppDropShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Apple macOS Continuous Squircle Chassis (824x824, rx=185 on 1024 grid) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#accChassis)" filter="url(#macAppDropShadow)"/>

  <!-- 2. Apple Knife-Edge Inner Highlight Stroke -->
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="url(#accRim)" stroke-width="2.5"/>

  <!-- 3. Ambient Background Circuit / Mesh Lines -->
  <g stroke="rgba(255,255,255,0.07)" stroke-width="2" stroke-linecap="round" fill="none">
    <circle cx="512" cy="512" r="320" stroke-dasharray="8 12"/>
    <circle cx="512" cy="512" r="230" stroke-dasharray="6 8"/>
    <line x1="200" y1="512" x2="300" y2="512"/>
    <line x1="724" y1="512" x2="824" y2="512"/>
    <line x1="512" y1="200" x2="512" y2="290"/>
    <line x1="512" y1="734" x2="512" y2="824"/>
  </g>

  <!-- 4. Multi-Provider Node Satellites (Anthropic Orange, OpenAI Emerald, Google Blue, DeepSeek Cyan) -->
  <g>
    <!-- Satellite 1: Anthropic Orange (Top-Left) -->
    <circle cx="340" cy="340" r="28" fill="#d97706" opacity="0.9" filter="url(#neonGlow)"/>
    <circle cx="340" cy="340" r="14" fill="#fef3c7"/>
    <line x1="360" y1="360" x2="430" y2="430" stroke="#d97706" stroke-width="3" stroke-dasharray="4 4" opacity="0.7"/>

    <!-- Satellite 2: OpenAI Emerald (Top-Right) -->
    <circle cx="684" cy="340" r="28" fill="#059669" opacity="0.9" filter="url(#neonGlow)"/>
    <circle cx="684" cy="340" r="14" fill="#d1fae5"/>
    <line x1="664" y1="360" x2="594" y2="430" stroke="#059669" stroke-width="3" stroke-dasharray="4 4" opacity="0.7"/>

    <!-- Satellite 3: Google Ice Blue (Bottom-Right) -->
    <circle cx="684" cy="684" r="28" fill="#2563eb" opacity="0.9" filter="url(#neonGlow)"/>
    <circle cx="684" cy="684" r="14" fill="#dbeafe"/>
    <line x1="664" y1="664" x2="594" y2="594" stroke="#2563eb" stroke-width="3" stroke-dasharray="4 4" opacity="0.7"/>

    <!-- Satellite 4: DeepSeek / xAI Violet (Bottom-Left) -->
    <circle cx="340" cy="684" r="28" fill="#7c3aed" opacity="0.9" filter="url(#neonGlow)"/>
    <circle cx="340" cy="684" r="14" fill="#ede9fe"/>
    <line x1="360" y1="664" x2="430" y2="594" stroke="#7c3aed" stroke-width="3" stroke-dasharray="4 4" opacity="0.7"/>
  </g>

  <!-- 5. Central Apple Upstream Account Smart Keycard (Frosted Dark Glass) -->
  <g filter="url(#badgeShadow)">
    <rect x="362" y="362" width="300" height="300" rx="60" fill="url(#accBadge)" stroke="rgba(255,255,255,0.3)" stroke-width="2.5"/>
    <rect x="372" y="372" width="280" height="280" rx="50" fill="rgba(15,23,42,0.6)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

    <!-- Gold Smart Security Chip -->
    <rect x="452" y="452" width="120" height="120" rx="26" fill="url(#chipGold)" stroke="#fef08a" stroke-width="2" filter="url(#neonGlow)"/>
    <!-- Chip Contact Engravings -->
    <rect x="472" y="472" width="80" height="80" rx="14" fill="none" stroke="#ca8a04" stroke-width="2.5"/>
    <line x1="452" y1="492" x2="472" y2="492" stroke="#ca8a04" stroke-width="2.5"/>
    <line x1="452" y1="532" x2="472" y2="532" stroke="#ca8a04" stroke-width="2.5"/>
    <line x1="552" y1="492" x2="572" y2="492" stroke="#ca8a04" stroke-width="2.5"/>
    <line x1="552" y1="532" x2="572" y2="532" stroke="#ca8a04" stroke-width="2.5"/>
    <line x1="492" y1="452" x2="492" y2="472" stroke="#ca8a04" stroke-width="2.5"/>
    <line x1="532" y1="452" x2="532" y2="472" stroke="#ca8a04" stroke-width="2.5"/>
    <line x1="492" y1="552" x2="492" y2="572" stroke="#ca8a04" stroke-width="2.5"/>
    <line x1="532" y1="552" x2="532" y2="572" stroke="#ca8a04" stroke-width="2.5"/>
    <circle cx="512" cy="512" r="8" fill="#ffffff"/>

    <!-- Keycard Header Ribbon -->
    <rect x="390" y="396" width="70" height="8" rx="4" fill="rgba(255,255,255,0.6)"/>
    <rect x="390" y="412" width="110" height="5" rx="2.5" fill="rgba(255,255,255,0.3)"/>

    <!-- Active Cluster Status LED -->
    <circle cx="620" cy="402" r="6" fill="#10b981" filter="url(#neonGlow)"/>
    <circle cx="620" cy="402" r="3" fill="#ffffff"/>

    <!-- Keycard Bottom ID Track -->
    <rect x="390" y="616" width="160" height="6" rx="3" fill="rgba(255,255,255,0.35)"/>
    <circle cx="616" cy="619" r="8" fill="rgba(255,255,255,0.2)"/>
    <circle cx="634" cy="619" r="8" fill="rgba(255,255,255,0.15)"/>
  </g>
</svg>