<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 256 256"><title>小铺</title><desc>珊瑚红条纹雨棚、瓷白店面、青色玻璃橱窗与黄铜门把手。</desc><defs>
