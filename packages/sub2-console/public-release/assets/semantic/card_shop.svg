  <linearGradient id="linen" x1="0" y1="0" x2="0.25" y2="1"><stop offset="0" stop-color="#e5d4b8"/><stop offset="0.25" stop-color="#fffbe8"/><stop offset="0.74" stop-color="#fff2d3"/><stop offset="1" stop-color="#d7bda0"/></linearGradient>
  <linearGradient id="coralHem" x1="0" y1="0" x2="0.25" y2="1"><stop offset="0" stop-color="#ec8068"/><stop offset="0.38" stop-color="#ed7c66"/><stop offset="1" stop-color="#b8463d"/></linearGradient>
  <linearGradient id="linenHem" x1="0" y1="0" x2="0.25" y2="1"><stop offset="0" stop-color="#fff4dc"/><stop offset="0.42" stop-color="#f7e8cc"/><stop offset="1" stop-color="#c5af91"/></linearGradient>
