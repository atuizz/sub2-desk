  <linearGradient id="glass" x1="0" y1="0" x2="0.25" y2="1"><stop offset="0" stop-color="#c5f3eb"/><stop offset="0.28" stop-color="#7acbc5"/><stop offset="0.62" stop-color="#499e9e"/><stop offset="1" stop-color="#20656e"/></linearGradient>
  <linearGradient id="doorGlass" x1="0" y1="0" x2="0.25" y2="1"><stop offset="0" stop-color="#8bd4ce"/><stop offset="0.5" stop-color="#3d9292"/><stop offset="1" stop-color="#174e59"/></linearGradient>
  <linearGradient id="stone" x1="0" y1="0" x2="0.25" y2="1"><stop offset="0" stop-color="#f9f6e9"/><stop offset="0.25" stop-color="#f1eddf"/><stop offset="0.3" stop-color="#b5b6a9"/><stop offset="1" stop-color="#8e9e94"/></linearGradient>
